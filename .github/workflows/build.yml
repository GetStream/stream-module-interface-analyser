name: Build

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name: Build (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build Interface Analyser
        run: swift build -c release --disable-sandbox

      - name: Smoke test
        run: .github/scripts/smoke-test.sh "$(swift build -c release --show-bin-path)/interface-analyser"

  linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    # Ubuntu 22.04 keeps the binary usable on older glibc versions.
    container: swift:6.0-jammy
    steps:
      - uses: actions/checkout@v4

      - name: Build Interface Analyser
        run: swift build -c release --static-swift-stdlib

      - name: Collect binary
        run: cp "$(swift build -c release --static-swift-stdlib --show-bin-path)/interface-analyser" interface-analyser-linux

      - uses: actions/upload-artifact@v4
        with:
          name: interface-analyser-linux
          path: interface-analyser-linux
          if-no-files-found: error

  linux-smoke-test:
    name: Smoke test (Linux, no Swift toolchain)
    runs-on: ubuntu-latest
    needs: linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: interface-analyser-linux

      # The runner image has no matching Swift runtime, so this proves the
      # binary is self-contained.
      - name: Smoke test
        run: |
          chmod +x interface-analyser-linux
          .github/scripts/smoke-test.sh ./interface-analyser-linux
