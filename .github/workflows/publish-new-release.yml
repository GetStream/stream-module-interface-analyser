# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Publish new release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.5)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux binary
    runs-on: ubuntu-latest
    # Ubuntu 22.04 keeps the binary usable on older glibc versions.
    container: swift:6.0-jammy
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Interface Analyser
        run: swift build -c release --static-swift-stdlib

      - name: Collect binary
        run: cp "$(swift build -c release --static-swift-stdlib --show-bin-path)/interface-analyser" interface-analyser-linux

      - uses: actions/upload-artifact@v4
        with:
          name: interface-analyser-linux
          path: interface-analyser-linux
          if-no-files-found: error

  release:
    name: Create and Publish Release
    runs-on: macos-15
    needs: build-linux
    permissions:
      contents: write # to create the release and upload the binaries

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Interface Analyser
        run: swift build -c release --disable-sandbox

      - name: Get Binary Path
        id: binary
        run: echo "BINARY_PATH=$(swift build -c release --show-bin-path)/interface-analyser" >> "$GITHUB_ENV"

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: interface-analyser-linux

      - name: Create Release Draft
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          draft: true
          generate_release_notes: true
          files: |
            ${{ env.BINARY_PATH }}
            interface-analyser-linux

      - name: Publish Release
        run: gh release edit v${{ inputs.version }} --draft=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
